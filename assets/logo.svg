<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220">
  <defs>
    <style>
      .text-n { font-family: 'Inter', 'Prompt', sans-serif; font-weight: 800; font-size: 110px; fill: #ffffff; }
      .text-c { font-family: 'Inter', 'Prompt', sans-serif; font-weight: 800; font-size: 110px; fill: #60a5fa; }
      .text-s { font-family: 'Inter', 'Prompt', sans-serif; font-weight: 800; font-size: 110px; fill: #f87171; }
      .text-a { font-family: 'Inter', 'Prompt', sans-serif; font-weight: 800; font-size: 110px; fill: #cbd5e1; }
      .text-th-s { font-family: 'Prompt', 'Sarabun', sans-serif; font-weight: 700; font-size: 42px; fill: #ffffff; }
      .text-th-k { font-family: 'Prompt', 'Sarabun', sans-serif; font-weight: 700; font-size: 42px; fill: #60a5fa; }
      .text-th-m { font-family: 'Prompt', 'Sarabun', sans-serif; font-weight: 700; font-size: 42px; fill: #f87171; }
      .text-th-ch { font-family: 'Prompt', 'Sarabun', sans-serif; font-weight: 700; font-size: 42px; fill: #ffffff; }
    </style>
  </defs>
  
  <!-- Shield emblem background behind A -->
  <g transform="translate(260, 20)">
    <path d="M 10 10 L 80 10 L 80 80 Q 80 140 45 160 Q 10 140 10 80 Z" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4"/>
    <!-- Grid inside shield -->
    <line x1="45" y1="10" x2="45" y2="160" stroke="rgba(255,255,255,0.4)" stroke-width="3" />
    <line x1="10" y1="60" x2="80" y2="60" stroke="rgba(255,255,255,0.4)" stroke-width="3" />
    <line x1="10" y1="100" x2="80" y2="100" stroke="rgba(255,255,255,0.4)" stroke-width="3" />
  </g>

  <!-- Main Letters N C S A -->
  <text x="5" y="115" class="text-n">N</text>
  <text x="80" y="115" class="text-c">C</text>
  <text x="160" y="115" class="text-s">S</text>
  <text x="240" y="115" class="text-a">A</text>

  <!-- Thai Subtext สกมช -->
  <g transform="translate(180, 175)">
    <text x="0" y="0" class="text-th-s">ส</text>
    <text x="28" y="0" class="text-th-k">ก</text>
    <text x="58" y="0" class="text-th-m">ม</text>
    <text x="92" y="0" class="text-th-ch">ช</text>
  </g>
</svg>
